version: "3.8"
services:
  visit-booker:
    build: .
    container_name: visit-booker
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - TZ=${TZ:-Europe/Brussels}
    volumes:
      - data:/app/data
volumes:
  data: {}
